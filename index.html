<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/ekko-lightbox/5.3.0/ekko-lightbox.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Jenny Hall Art | Portfolio</title>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="site-nav">
      <span class="site-nav__mark">Jenny Hall Art</span>
      <ul class="site-nav__links">
        <li><a href="index.html" class="is-active">Portfolio</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <!-- Header -->
    <header class="site-header">
      <p class="site-header__kicker">New Albany, Mississippi</p>
      <h1 class="site-header__title">Jenny Hall</h1>
      <p class="site-header__subtitle">Paintings and Portraits</p>
    </header>

    <!-- GALLERY -->
    <section id="gallery">
      <div class="gallery-grid">
        <a href="img/unnamed.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/unnamed.jpg" alt="" />
        </a>
        <a href="img/wedding-bouquet.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/wedding-bouquet.jpg" alt="" />
        </a>
        <a href="img/billie.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/billie.jpg" alt="" />
        </a>
        <a href="img/guitar.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/guitar.jpg" alt="" />
        </a>
        <a href="img/larry.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/larry.jpg" alt="" />
        </a>
        <a href="img/peacock.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/peacock.jpg" alt="" />
        </a>
        <a href="img/mick.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/mick.jpg" alt="" />
        </a>
        <a href="img/tommy.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/tommy-close.jpg" alt="" />
        </a>
        <a href="img/dan.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/dan.jpg" alt="" />
        </a>
        <a href="img/muddy.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/muddy.jpg" alt="" />
        </a>
        <a href="img/eudora.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/eudora.jpg" alt="" style="object-position: top;" />
        </a>
        <a href="img/william.jpg" data-gallery="gallery" data-toggle="lightbox">
          <img src="./img/william.jpg" alt="" />
        </a>
      </div>
    </section>

    <!-- CALL TO ACTION -->
    <section class="cta">
      <h2 class="cta__heading">Have a project in mind?</h2>
      <a class="cta__button" href="contact.html">Request A Quote</a>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <div>Copyright &copy; <span id="year"></span> Jenny Hall Art</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.13.0/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ekko-lightbox/5.3.0/ekko-lightbox.min.js"></script>

    <script src="js/main.js"></script>
    <script>
      $(document).on('click', '[data-toggle="lightbox"]', function (event) {
        event.preventDefault();
        $(this).ekkoLightbox();
      });
    </script>
  </body>
</html>
